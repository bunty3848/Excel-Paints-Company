    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Excel Paints Company - Leading manufacturer of wall putty, decorative white cement, cement paints, and white wash in Patna, Bihar. ISO 9001:2015 certified." />

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>Excel Paints Company - Quality Wall Putty & Cement Products | Patna, Bihar</title>

    <!-- Structured Data: helps Google show our logo/brand correctly in search results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Excel Paints Company",
      "url": "https://www.excelpaintscompany.in",
      "logo": "https://www.excelpaintscompany.in/images/Logo.png",
      "image": "https://www.excelpaintscompany.in/images/Logo.png",
      "description": "Leading manufacturer of wall putty, decorative white cement, cement paints, and white wash in Patna, Bihar. ISO 9001:2015 certified.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Abdullahchak",
        "addressLocality": "Patna",
        "postalCode": "800007",
        "addressRegion": "Bihar",
        "addressCountry": "IN"
      },
      "telephone": "+919798081022",
      "email": "excelpaintscompany@gmail.com",
      "sameAs": [
        "https://www.facebook.com/share/175x5uXA8g/",
        "https://www.linkedin.com/company/excel-paints-company/",
        "https://www.instagram.com/excel_paints_patna"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- 
      Hidden static form so Netlify's build bot can detect and register this form.
      This is required for Netlify Forms to work with a React/Vite SPA, since 
      Netlify scans the built HTML (not the JS-rendered React form) at deploy time.
      Do not remove - the real, visible form in Contact.jsx submits to this same 
      form name via fetch().
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="product" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
